services:
  - type: web
    name: pramaan-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        value: https://pramaan-app.vercel.app
      - key: FRONTEND_ORIGINS
        value: http://localhost:5500,http://localhost:8000,https://pramaan-app.vercel.app
      - key: UPLOAD_DIR
        value: ./uploads
